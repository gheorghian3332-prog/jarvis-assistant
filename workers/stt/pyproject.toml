[project]
name = "jarvis-stt"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "faster-whisper>=1.2.1",
    "numpy>=2.5.5",
    "nvidia-cublas-cu12==12.8.4.1",
    "nvidia-cudnn-cu12==9.8.0.87",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["jarvis_stt", "tests"]

[[tool.mypy.overrides]]
module = ["faster_whisper", "faster_whisper.*", "ctranslate2"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: loads the real Whisper model (needs the model cache or network on first run)"]

[tool.uv]
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis_stt"]
