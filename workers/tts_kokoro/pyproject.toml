[project]
name = "jarvis-tts-kokoro"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "kokoro-onnx>=0.6.1",
    "numpy>=2.5.5",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["jarvis_tts_kokoro", "tests"]

[[tool.mypy.overrides]]
module = ["kokoro_onnx", "kokoro_onnx.*", "onnxruntime", "onnxruntime.*", "espeakng_loader"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: loads the real Kokoro model (needs the model files in %LOCALAPPDATA%\\Jarvis\\models\\kokoro)"]

[tool.uv]
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis_tts_kokoro"]
