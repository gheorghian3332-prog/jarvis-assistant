[package]
name = "jarvis-core"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time", "macros", "process", "io-util"] }
tracing = "0.1"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time", "test-util", "io-util"] }
