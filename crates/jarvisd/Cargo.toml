[package]
name = "jarvisd"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
jarvis-core = { path = "../jarvis-core" }
jarvis-sysintel = { path = "../jarvis-sysintel" }
jarvis-vision = { path = "../jarvis-vision" }
jarvis-voice = { path = "../jarvis-voice" }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "signal", "time", "macros", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
