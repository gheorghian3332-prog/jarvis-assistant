[package]
name = "jarvis-tts"
version.workspace = true
edition.workspace = true
description = "Speech output: Piper (RU), Kokoro (EN), optional ElevenLabs, playback, interruption and level envelope"

[dependencies]
async-trait = "0.1"
cpal = "0.18"
hound = "3.5"
jarvis-core = { path = "../jarvis-core" }
keyring = "4"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time", "macros", "process", "io-util", "fs"] }
tracing = "0.1"

[dev-dependencies]
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "sync", "time", "macros", "process", "io-util", "fs", "net", "test-util"] }
